name: adap-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adap
      POSTGRES_PASSWORD: ${ADAP_PG_PASSWORD}
      POSTGRES_DB: adap
    command: ["postgres", "-c", "max_connections=40", "-c", "superuser_reserved_connections=3"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adap -d adap"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"
    networks: [trust]

  vault:
    image: hashicorp/vault:1.18.5
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:18200:8200"
    networks: [trust]

  bootstrap:
    build:
      context: ..
      dockerfile: staging/Dockerfile
    command: ["node", "staging/bootstrap-vault.mjs"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      BOOTSTRAP_DIR: /bootstrap
    volumes:
      - bootstrap:/bootstrap
    depends_on:
      vault:
        condition: service_healthy
    networks: [trust]
    restart: "no"

  downstream:
    build:
      context: ..
      dockerfile: staging/Dockerfile
    command: ["node", "staging/downstream/server.mjs"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /bootstrap/read-token
      PORT: "8080"
    volumes:
      - bootstrap:/bootstrap:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [trust]

  alert-sink:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./alert-sink/server.mjs:/app/server.mjs:ro
    ports:
      - "127.0.0.1:9099:9099"
    networks: [trust]

  gateway-a:
    build:
      context: ..
      dockerfile: staging/Dockerfile
    command: ["sh", "-c", "export VAULT_TOKEN=\"$$(cat /bootstrap/read-token)\" && exec node packages/adap-gateway/dist/server.js"]
    environment: &gateway-env
      ADAP_REPLICA_ID: gateway-a
      PORT: "8443"
      ADAP_PG_URL: postgres://adap:${ADAP_PG_PASSWORD}@postgres:5432/adap?options=-c%20lock_timeout%3D500
      ADAP_DIRECTORY_PATH: /secrets/directory.json
      ADAP_ISSUER_KEY_PATH: /secrets/issuer.pem
      ADAP_GATEWAY_CLIENT_TOKEN: ${ADAP_GATEWAY_CLIENT_TOKEN}
      VAULT_ADDR: http://vault:8200
      ADAP_DOWNSTREAM_ALLOWLIST: http://downstream:8080/
      ADAP_ALERT_WEBHOOK: http://alert-sink:9099/alerts
      TLS_CERT_PATH: /secrets/tls/cert.pem
      TLS_KEY_PATH: /secrets/tls/key.pem
    volumes: &gateway-volumes
      - bootstrap:/bootstrap:ro
      - ./.secrets/directory.json:/secrets/directory.json:ro
      - ./.secrets/issuer.pem:/secrets/issuer.pem:ro
      - ./.secrets/tls/cert.pem:/secrets/tls/cert.pem:ro
      - ./.secrets/tls/key.pem:/secrets/tls/key.pem:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:8443,path:'/healthz',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    networks: [edge, trust]

  gateway-b:
    build:
      context: ..
      dockerfile: staging/Dockerfile
    command: ["sh", "-c", "export VAULT_TOKEN=\"$$(cat /bootstrap/read-token)\" && exec node packages/adap-gateway/dist/server.js"]
    environment:
      <<: *gateway-env
      ADAP_REPLICA_ID: gateway-b
    volumes: *gateway-volumes
    ports:
      - "127.0.0.1:8444:8443"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:8443,path:'/healthz',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    networks: [edge, trust]

  agent:
    image: curlimages/curl:8.11.1
    command: ["sleep", "infinity"]
    volumes:
      - ./.secrets/tls/cert.pem:/certs/cert.pem:ro
    networks: [edge]

volumes:
  pgdata:
  bootstrap:

networks:
  edge:
  trust:
