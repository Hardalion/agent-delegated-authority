# One team, one console, one sandbox. Set COMPOSE_PROJECT_NAME per team as an
# additional isolation boundary. The console requires an HTTPS reverse proxy.
# This file does not start anything by itself and does not contain secrets.
services:
  sandbox:
    build:
      context: ../..
      dockerfile: apps/hackathon-console/Dockerfile
    user: "10001:10001"
    command: ["node", "services/sandbox-apis/server.mjs"]
    environment:
      SANDBOX_CONTAINER: "1"
      SANDBOX_TOKEN: ${ADAP_SANDBOX_TOKEN:?set ADAP_SANDBOX_TOKEN}
      SANDBOX_PORT: "4318"
      SANDBOX_DB: /data/${ADAP_TEAM_ID:?set ADAP_TEAM_ID}-hackathon.sqlite
      SANDBOX_FAULTS: "0"
    volumes:
      - hackathon-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/health',{headers:{authorization:'Bearer '+process.env.SANDBOX_TOKEN}}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  console:
    build:
      context: ../..
      dockerfile: apps/hackathon-console/Dockerfile
    environment:
      ADAP_CONTAINER: "1"
      ADAP_DEPLOYMENT: hosted
      NODE_ENV: production
      ADAP_BIND_HOST: 0.0.0.0
      ADAP_DEMO_PORT: "4317"
      ADAP_TEAM_ID: ${ADAP_TEAM_ID:?set ADAP_TEAM_ID}
      ADAP_TEAM_TOKEN: ${ADAP_TEAM_TOKEN:?set ADAP_TEAM_TOKEN}
      ADAP_APPROVER_PASSPHRASE: ${ADAP_APPROVER_PASSPHRASE:?set ADAP_APPROVER_PASSPHRASE}
      ADAP_SESSION_SECRET: ${ADAP_SESSION_SECRET:?set ADAP_SESSION_SECRET}
      ADAP_STATE_DIR: /data/state
      ADAP_STATE_ENCRYPTION_KEY: ${ADAP_STATE_ENCRYPTION_KEY:?set ADAP_STATE_ENCRYPTION_KEY}
      ADAP_SANDBOX_URL: http://sandbox:4318
      ADAP_SANDBOX_TOKEN: ${ADAP_SANDBOX_TOKEN:?set ADAP_SANDBOX_TOKEN}
      # Secure cookies require TLS termination in front of this listener.
      ADAP_COOKIE_SECURE: "1"
    volumes:
      - hackathon-data:/data
    ports:
      - "127.0.0.1:${CONSOLE_HOST_PORT:-4317}:4317"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    depends_on:
      sandbox:
        condition: service_healthy
volumes:
  hackathon-data:
    name: hackathon-data-${ADAP_TEAM_ID}
