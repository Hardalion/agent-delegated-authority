name: Publish packages

on:
  push:
    tags:
      - "v*"

# Provenance needs the workflow's OIDC token. The job does not write to the repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter adap-receipt publish --access public --provenance
          pnpm --filter adap-policy publish --access public --provenance
          pnpm --filter adap publish --access public --provenance
          pnpm --filter adap-store-postgres publish --access public --provenance
          pnpm --filter adap-gateway publish --access public --provenance
