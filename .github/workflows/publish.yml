name: Publish packages

on:
  push:
    tags:
      - "v*"

# Provenance needs the workflow's OIDC token. The job does not write to the repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_if_missing() {
            name="$1"
            version="$(node -p "require('./packages/$2/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version}"
            else
              pnpm --filter "$name" publish --access public --provenance --no-git-checks
            fi
          }
          publish_if_missing adap-receipt audit-verify
          publish_if_missing adap-policy policy-engine
          publish_if_missing adap-core aap
          publish_if_missing adap-store-postgres adap-store-postgres
          publish_if_missing adap-gateway adap-gateway
